name: Tests

on:
  push:
    branches: 
       - "*"
  pull_request:
    branches:
       - "*"
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # A hung test would otherwise hold the runner for the 6h default.
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v3
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.2' # or, you can use 1.22
        channel: 'stable'
        cache: true
    # Per-test timeout so a hang fails with the test's name instead of stalling.
    - run: flutter test --coverage --reporter expanded --timeout 120s
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
